name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # El índice es OTRO repositorio, y las pruebas de aceptación del ciclo 5
      # convierten desde él con el conversor real. Sin el clon se saltan, así
      # que lo que demuestra que el bucle cierra —índice → conversor → skill →
      # veredicto— no se comprobaba en ninguna parte.
      #
      # Y hay un modo de fallo que sólo este paso caza: que los dos repos se
      # desincronicen. Un clon viejo no rompe nada visible; simplemente el
      # conversor deja de emitir lo que la prueba espera. Clonándolo aquí, la
      # desincronización se ve el día que ocurre.
      - name: Clonar el índice, hermano del repo
        run: git clone --depth 1 https://github.com/alcyedmundo281/medsemiotics-db.git ../../medsemiotics-db
        working-directory: backend

      # Las cuatro puertas, en el orden en que cuesta menos fallar: primero
      # lo que se arregla solo, luego lo que exige pensar.
      - name: Linter
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipos
        # Caza la clase de fallo que este dominio no puede permitirse: un
        # `None` que se multiplica, un atributo que el tipo no garantiza.
        # No sustituye a las pruebas; llega antes que ellas.
        run: mypy

      - name: Tests
        # No requieren Ollama ni ninguna terminología externa: el pipeline
        # se ejercita con dobles y el almacén con una base temporal.
        run: pytest -q

      - name: El sistema arranca sin nada instalado
        # Comprueba la promesa de "clonar y usar": sin modelos, sin
        # terminología con licencia y sin servidor de base de datos, el
        # vocabulario semilla debe cargar y el validador quedar operativo.
        run: |
          python scripts/importar_terminologia.py --semilla
          python scripts/importar_terminologia.py --estado

      - name: Los protocolos anclan lo que acuñan
        # Con el vocabulario ya cargado, comprueba que ningún protocolo
        # apunte a un concepto que no existe: ni sus hints, ni su ámbito de
        # grafo, ni —lo que hasta ahora no se miraba— la condición que
        # representa y el término que su clasificación acuña. Un código
        # colgado ahí no falla: emite el diagnóstico sin linaje ni CIE-10,
        # en silencio. Aquí deja de ser silencioso.
        run: |
          python -m holonmed.cli skills --validar | tee /tmp/validacion.txt
          grep -q "Todos los protocolos son válidos" /tmp/validacion.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que no se han colado credenciales
        # Red de seguridad para un repositorio público: si algo con pinta
        # de credencial llega a main, la build falla de forma ruidosa.
        run: |
          set -e
          patrones='credentials.json|client_secret.*\.json|^token\.json|\.pem$|\.p12$|id_rsa'
          if git ls-files | grep -nEi "$patrones"; then
            echo "::error::Hay archivos de credenciales versionados"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!LICENSE'; then
            echo "::error::Hay una clave privada en el código"
            exit 1
          fi
          echo "Sin credenciales detectadas."
